<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Игра — Кто хочет стать миллионером</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  body{padding-top:16px;}
  .game-wrap{width:100%; max-width:1080px; display:grid; grid-template-columns:1fr 220px; gap:18px;}
  @media (max-width:760px){ .game-wrap{grid-template-columns:1fr;} .ladder{order:-1;} .players-panel{order:-1;} }
  .main-card{padding:22px;}
  .topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:10px;}
  .player-badge{font-family:'Space Mono',monospace; font-weight:700; color:var(--gold-bright); font-size:15px;}
  .timer-ring{display:flex; align-items:center; gap:8px; font-family:'Space Mono',monospace; font-size:14px;}
  .timer-bar{width:110px; height:6px; background:rgba(255,255,255,0.08); border-radius:4px; overflow:hidden;}
  .timer-fill{height:100%; background:linear-gradient(90deg,var(--good),var(--gold)); width:100%; transition:width 1s linear;}
  .timer-fill.low{background:var(--bad);}
  .lifelines{display:flex; gap:10px; margin-bottom:18px;}
  .life-btn{flex:1; border:1px solid var(--line); background:rgba(255,255,255,0.03); color:var(--ink); padding:10px 8px; border-radius:10px; font-size:12px; font-weight:700; cursor:pointer; text-align:center; line-height:1.3;}
  .life-btn:hover:not(:disabled){border-color:var(--gold); background:rgba(232,184,75,0.08);}
  .life-btn:disabled{opacity:.25; cursor:not-allowed; text-decoration:line-through;}
  .life-emoji{display:block; font-size:18px; margin-bottom:3px;}
  .qcounter{font-size:12px; letter-spacing:2px; text-transform:uppercase; color:var(--ink-dim); margin-bottom:8px;}
  .prize-current{font-family:'Space Mono',monospace; color:var(--gold-bright); font-weight:700;}
  .question-box{background:radial-gradient(circle at 50% 0%, rgba(232,184,75,0.10), transparent 70%), rgba(0,0,0,0.22); border:1px solid var(--line); border-radius:16px; padding:26px 24px; margin-bottom:18px; min-height:96px; display:flex; align-items:center; font-size:19px; font-weight:700; line-height:1.4;}
  .options{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  @media(max-width:520px){.options{grid-template-columns:1fr;}}
  .opt{display:flex; align-items:center; gap:10px; border:1px solid var(--line); background:rgba(255,255,255,0.03); color:var(--ink); padding:14px 16px; border-radius:12px; font-size:15px; font-weight:600; text-align:left; cursor:pointer;}
  .opt:hover:not(:disabled){border-color:var(--gold); background:rgba(232,184,75,0.06);}
  .opt .k{font-family:'Space Mono',monospace; font-weight:700; color:var(--gold); border:1px solid var(--line); border-radius:6px; width:26px; height:26px; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:13px;}
  .opt:disabled{cursor:default;}
  .opt.correct{background:rgba(63,174,107,0.22); border-color:var(--good);}
  .opt.correct .k{border-color:var(--good); color:var(--good);}
  .opt.wrong{background:rgba(216,73,63,0.22); border-color:var(--bad);}
  .opt.wrong .k{border-color:var(--bad); color:var(--bad);}
  .opt.faded{opacity:.15;}
  .opt.picked{outline:2px dashed var(--gold);}
  .audience-bars{display:none; gap:10px; margin:10px 0;}
  .audience-bars.show{display:grid; grid-template-columns:repeat(4,1fr);}
  .abar-wrap{display:flex; flex-direction:column; align-items:center; gap:4px; font-family:'Space Mono',monospace; font-size:11px; color:var(--ink-dim);}
  .abar-track{width:100%; height:60px; background:rgba(255,255,255,0.06); border-radius:6px; display:flex; align-items:flex-end; overflow:hidden;}
  .abar-fill{width:100%; background:linear-gradient(180deg,var(--gold-bright),var(--gold)); border-radius:6px 6px 0 0; transition:height .6s ease;}
  .expert-msg{display:none; margin:10px 0; background:rgba(232,184,75,0.08); border:1px solid var(--line); border-radius:10px; padding:12px 14px; font-size:13px; color:var(--ink-dim);}
  .expert-msg.show{display:block;}
  .expert-msg b{color:var(--gold-bright);}
  .status-msg{text-align:center; padding:14px; font-size:14px; color:var(--ink-dim);}
  .ladder{background:rgba(0,0,0,0.22); border:1px solid var(--line); border-radius:16px; padding:14px 10px; display:flex; flex-direction:column-reverse; gap:3px; font-family:'Space Mono',monospace; height:fit-content;}
  .rung{display:flex; justify-content:space-between; padding:6px 9px; border-radius:8px; font-size:11.5px; color:var(--ink-dim);}
  .rung.checkpoint{color:var(--gold-bright); font-weight:700;}
  .rung.current{background:linear-gradient(90deg, rgba(232,184,75,0.28), rgba(232,184,75,0.06)); color:var(--gold-bright); font-weight:800; border:1px solid var(--gold);}
  .rung.passed{color:var(--ink);}
  .rung .n{opacity:.6; margin-right:6px;}
  .players-panel{background:rgba(0,0,0,0.22); border:1px solid var(--line); border-radius:16px; padding:14px; height:fit-content;}
  .players-panel h3{margin:0 0 10px; font-size:13px; text-transform:uppercase; letter-spacing:1.5px; color:var(--ink-dim);}
  .pp-row{display:flex; justify-content:space-between; align-items:center; padding:7px 8px; border-radius:8px; font-size:12.5px; margin-bottom:4px;}
  .pp-row.me{background:rgba(232,184,75,0.10);}
  .pp-row .nm{font-weight:700;}
  .pp-row .st{font-family:'Space Mono',monospace; font-size:11px;}
  .st.alive{color:var(--good);}
  .st.out{color:var(--bad);}
  .st.won{color:var(--gold-bright);}
  .overlay-card{max-width:520px; text-align:center; margin:0 auto;}
  .result-emoji{font-size:44px; margin-bottom:8px;}
  .result-title{font-family:'Playfair Display',serif; font-size:22px; color:var(--gold-bright); margin-bottom:16px;}
  .lb-row{display:flex; align-items:center; gap:14px; padding:12px 16px; border:1px solid var(--line); border-radius:12px; margin-bottom:8px; background:rgba(255,255,255,0.02); text-align:left;}
  .lb-row.winner{border-color:var(--gold); background:linear-gradient(90deg, rgba(232,184,75,0.14), transparent);}
  .lb-rank{font-family:'Space Mono',monospace; font-weight:800; font-size:17px; color:var(--gold-bright); width:26px;}
  .lb-name{flex:1; font-weight:700;}
  .lb-amount{font-family:'Space Mono',monospace; font-weight:700;}
  .music-toggle{position:fixed; top:16px; right:16px; background:rgba(255,255,255,0.05); border:1px solid var(--line); color:var(--ink); border-radius:999px; width:42px; height:42px; font-size:18px; cursor:pointer; z-index:5;}
  .music-toggle:hover{border-color:var(--gold);}
  #confirmBtn:disabled{opacity:.35; cursor:not-allowed;}
</style>
</head>
<body>
<button class="music-toggle" id="musicToggle" title="Включить/выключить музыку">🔇</button>

<div class="logo" style="font-size:22px;">КТО ХОЧЕТ СТАТЬ МИЛЛИОНЕРОМ</div>

<div class="game-wrap hidden" id="gameScreen">
  <div class="card main-card">
    <div class="topbar">
      <div class="player-badge">Вы: <span id="meName"></span></div>
      <div class="timer-ring">⏱ <div class="timer-bar"><div class="timer-fill" id="timerFill"></div></div> <span id="timerNum">25</span>с</div>
    </div>
    <div class="lifelines">
      <button class="life-btn" id="lifeFifty"><span class="life-emoji">✂️</span>50 / 50</button>
      <button class="life-btn" id="lifeAudience"><span class="life-emoji">👥</span>Помощь зала</button>
      <button class="life-btn" id="lifeExpert"><span class="life-emoji">🎓</span>Совет эксперта</button>
    </div>
    <div class="qcounter">Вопрос <span id="qNum">1</span> из 20 · за правильный ответ: <span class="prize-current" id="qPrize">500 ₽</span></div>
    <div class="question-box" id="questionText">Ожидание вопроса…</div>
    <div class="audience-bars" id="audienceBars"></div>
    <div class="expert-msg" id="expertMsg"></div>
    <div class="options" id="optionsBox"></div>
    <button class="btn" id="confirmBtn" disabled style="margin-top:14px;">Подтвердить ответ</button>
    <div class="status-msg hidden" id="statusMsg"></div>
  </div>

  <div class="ladder" id="ladder"></div>
  <div class="players-panel" id="playersPanel"><h3>Игроки в комнате</h3><div id="ppList"></div></div>
</div>

<div class="card overlay-card hidden" id="overScreen">
  <div class="result-emoji">🏁</div>
  <div class="result-title">Игра завершена</div>
  <div id="lbList"></div>
  <button class="btn" id="backToLobbyBtn">Вернуться в лобби</button>
</div>

<div class="card hidden" id="noGameScreen">
  <div class="status-msg">Вы ещё не в игре. Вернитесь в лобби, чтобы создать или найти комнату.</div>
  <button class="btn" id="backToLobbyBtn2">В лобби</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/audio.js"></script>
<script>
const token = localStorage.getItem('mq_token');
const username = localStorage.getItem('mq_username');
if(!token){ window.location.href = '/index.html'; }

const LADDER = [500,1000,2000,3000,5000,10000,15000,25000,50000,100000,
                 200000,400000,800000,1500000,3000000,4000000,5000000,7000000,8500000,10000000];
const CHECKPOINTS = [5,10,15,20];
function fmt(n){ return n.toLocaleString('ru-RU') + ' ₽'; }

const gameScreen = document.getElementById('gameScreen');
const overScreen = document.getElementById('overScreen');
const noGameScreen = document.getElementById('noGameScreen');
document.getElementById('meName').textContent = username;

const socket = io({ auth: { token } });
socket.on('connect_error', (err) => {
  if(err.message === 'unauthorized'){ localStorage.removeItem('mq_token'); window.location.href='/index.html'; }
});

let myLevel = 0;
let iAmAlive = true;
let latestPlayers = [];
let answered = false;
let selectedChoice = null;
let timerInterval = null;

const musicToggle = document.getElementById('musicToggle');
musicToggle.onclick = () => {
  const on = MQAudio.toggleAmbient('game');
  musicToggle.textContent = on ? '🔊' : '🔇';
};

const confirmBtn = document.getElementById('confirmBtn');

const qNumEl = document.getElementById('qNum');
const qPrizeEl = document.getElementById('qPrize');
const questionText = document.getElementById('questionText');
const optionsBox = document.getElementById('optionsBox');
const audienceBars = document.getElementById('audienceBars');
const expertMsg = document.getElementById('expertMsg');
const statusMsg = document.getElementById('statusMsg');
const timerFill = document.getElementById('timerFill');
const timerNum = document.getElementById('timerNum');
const ladderEl = document.getElementById('ladder');
const ppList = document.getElementById('ppList');

const lifeFifty = document.getElementById('lifeFifty');
const lifeAudience = document.getElementById('lifeAudience');
const lifeExpert = document.getElementById('lifeExpert');

let showFallbackTimer = setTimeout(() => {
  if(gameScreen.classList.contains('hidden') && overScreen.classList.contains('hidden')){
    noGameScreen.classList.remove('hidden');
  }
}, 2500);

function renderLadder(){
  ladderEl.innerHTML = '';
  for(let i=0;i<LADDER.length;i++){
    const levelNum = i+1;
    const row = document.createElement('div');
    let cls = 'rung';
    if(CHECKPOINTS.includes(levelNum)) cls += ' checkpoint';
    if(levelNum === myLevel+1) cls += ' current';
    else if(levelNum <= myLevel) cls += ' passed';
    row.className = cls;
    row.innerHTML = `<span><span class="n">${levelNum}</span>${fmt(LADDER[i])}</span>${CHECKPOINTS.includes(levelNum)?'🔒':''}`;
    ladderEl.appendChild(row);
  }
}

function renderPlayers(){
  ppList.innerHTML = '';
  latestPlayers.forEach(p=>{
    const row = document.createElement('div');
    row.className = 'pp-row' + (p.username===username?' me':'');
    let st = 'alive', label = `ур. ${p.level}`;
    if(p.finishedReason==='won'){ st='won'; label='🏆'; }
    else if(!p.alive){ st='out'; label = fmt(p.bankedMoney); }
    row.innerHTML = `<span class="nm">${p.username}${!p.connected?' 📴':''}</span><span class="st ${st}">${label}</span>`;
    ppList.appendChild(row);
  });
}

socket.on('room:players', (data) => { latestPlayers = data.players; renderPlayers(); });

socket.on('game:started', () => {
  clearTimeout(showFallbackTimer);
  noGameScreen.classList.add('hidden');
  overScreen.classList.add('hidden');
  gameScreen.classList.remove('hidden');
  myLevel = 0; iAmAlive = true;
  lifeFifty.disabled = false; lifeAudience.disabled = false; lifeExpert.disabled = false;
  renderLadder();
  MQAudio.startAmbient('game');
  musicToggle.textContent = '🔊';
});

socket.on('game:question', (q) => {
  clearTimeout(showFallbackTimer);
  noGameScreen.classList.add('hidden');
  overScreen.classList.add('hidden');
  gameScreen.classList.remove('hidden');
  answered = false;
  selectedChoice = null;
  confirmBtn.disabled = true;
  confirmBtn.classList.remove('hidden');
  confirmBtn.textContent = 'Подтвердить ответ';
  qNumEl.textContent = q.index + 1;
  qPrizeEl.textContent = fmt(q.prize);
  questionText.textContent = q.text;
  audienceBars.classList.remove('show'); audienceBars.innerHTML = '';
  expertMsg.classList.remove('show'); expertMsg.innerHTML = '';
  statusMsg.classList.add('hidden');

  optionsBox.innerHTML = '';
  const letters = ['A','B','C','D'];
  q.options.forEach((text, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = `<span class="k">${letters[i]}</span><span>${text}</span>`;
    if(q.spectateOnly){
      btn.disabled = true;
    } else {
      btn.onclick = () => pickAnswer(i);
    }
    optionsBox.appendChild(btn);
  });

  if(q.spectateOnly){
    confirmBtn.classList.add('hidden');
    statusMsg.classList.remove('hidden');
    statusMsg.textContent = 'Вы выбыли из игры — можно наблюдать за раундом.';
    lifeFifty.disabled = true; lifeAudience.disabled = true; lifeExpert.disabled = true;
  }

  startClientTimer(q.durationSeconds, q.startedAt);
});

function startClientTimer(durationSeconds, startedAt){
  clearInterval(timerInterval);
  let lastTickSecond = null;
  function tick(){
    const elapsed = (Date.now() - startedAt) / 1000;
    const left = Math.max(0, durationSeconds - elapsed);
    const leftRounded = Math.ceil(left);
    timerNum.textContent = leftRounded;
    timerFill.style.width = (left/durationSeconds*100) + '%';
    const low = left <= 8;
    timerFill.classList.toggle('low', low);
    if(low && leftRounded !== lastTickSecond && leftRounded > 0){
      lastTickSecond = leftRounded;
      MQAudio.playTick(leftRounded <= 3);
    }
    if(left <= 0){
      clearInterval(timerInterval);
      // время вышло, но подтвердить ещё не успели — отправляем выбранный вариант (или ничего)
      if(!answered) confirmAnswer(true);
    }
  }
  tick();
  timerInterval = setInterval(tick, 200);
}

function pickAnswer(i){
  if(answered) return;
  selectedChoice = i;
  [...optionsBox.children].forEach((b,idx) => b.classList.toggle('picked', idx===i));
  confirmBtn.disabled = false;
}

function confirmAnswer(auto){
  if(answered) return;
  answered = true;
  confirmBtn.disabled = true;
  confirmBtn.classList.add('hidden');
  if(selectedChoice !== null){
    socket.emit('game:answer', { choiceIndex: selectedChoice });
  }
  [...optionsBox.children].forEach((b) => { b.disabled = true; });
  statusMsg.classList.remove('hidden');
  statusMsg.textContent = selectedChoice === null
    ? 'Время вышло — ответ не отправлен.'
    : 'Ответ отправлен — ждём остальных игроков…';
}
confirmBtn.onclick = () => confirmAnswer(false);

socket.on('game:answerReceived', () => {
  statusMsg.classList.remove('hidden');
  statusMsg.textContent = 'Ответ отправлен — ждём остальных игроков…';
});

socket.on('game:locked', ({ delayMs }) => {
  clearInterval(timerInterval);
  confirmBtn.disabled = true;
  confirmBtn.classList.add('hidden');
  [...optionsBox.children].forEach(b => { b.disabled = true; });
  statusMsg.classList.remove('hidden');
  let secondsLeft = Math.round((delayMs || 5000) / 1000);
  statusMsg.textContent = `Все ответили! Правильный ответ через ${secondsLeft}…`;
  MQAudio.playTick(true);
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    secondsLeft -= 1;
    if(secondsLeft > 0){
      statusMsg.textContent = `Все ответили! Правильный ответ через ${secondsLeft}…`;
      MQAudio.playTick(secondsLeft <= 2);
    } else {
      clearInterval(timerInterval);
    }
  }, 1000);
});

socket.on('game:reveal', ({ correctIndex, results }) => {
  clearInterval(timerInterval);
  [...optionsBox.children].forEach((b,idx) => {
    b.disabled = true;
    if(idx === correctIndex) b.classList.add('correct');
  });
  const mine = results.find(r => r.username === username);
  if(mine){
    if(mine.chosen !== null && mine.chosen !== correctIndex){
      optionsBox.children[mine.chosen].classList.add('wrong');
    }
    myLevel = mine.level;
    iAmAlive = mine.alive;
    renderLadder();
    statusMsg.classList.remove('hidden');
    if(mine.chosen === null){
      statusMsg.textContent = 'Время вышло — ответ не был отправлен.';
      MQAudio.playWrong();
    } else if(mine.correct){
      statusMsg.textContent = mine.alive ? 'Верно! Следующий вопрос скоро появится…' : '🏆 Верно! Вы прошли всю игру!';
      MQAudio.playCorrect();
    } else {
      statusMsg.textContent = `Неверно. Ваш итог: ${fmt(mine.bankedMoney)}`;
      MQAudio.playWrong();
    }
  }
});

socket.on('game:over', ({ standings }) => {
  gameScreen.classList.add('hidden');
  overScreen.classList.remove('hidden');
  const list = document.getElementById('lbList');
  list.innerHTML = '';
  standings.forEach((p,i)=>{
    const row = document.createElement('div');
    row.className = 'lb-row' + (i===0 && p.bankedMoney>0 ? ' winner' : '');
    const rank = i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1);
    row.innerHTML = `<div class="lb-rank">${rank}</div><div class="lb-name">${p.username}</div><div class="lb-amount">${fmt(p.bankedMoney)}</div>`;
    list.appendChild(row);
  });
});

function backToLobby(){
  localStorage.removeItem('mq_room');
  window.location.href = '/lobby.html';
}
document.getElementById('backToLobbyBtn').onclick = backToLobby;
document.getElementById('backToLobbyBtn2').onclick = backToLobby;

lifeFifty.onclick = () => socket.emit('lifeline:fifty');
lifeAudience.onclick = () => socket.emit('lifeline:audience');
lifeExpert.onclick = () => socket.emit('lifeline:expert');

socket.on('lifeline:fiftyResult', ({ hideIndices }) => {
  lifeFifty.disabled = true;
  hideIndices.forEach(i => {
    const btn = optionsBox.children[i];
    if(btn){ btn.classList.add('faded'); btn.disabled = true; }
  });
});

socket.on('lifeline:audienceResult', ({ percentages }) => {
  lifeAudience.disabled = true;
  audienceBars.classList.add('show');
  audienceBars.innerHTML = '';
  const letters = ['A','B','C','D'];
  percentages.forEach((p,i)=>{
    const wrap = document.createElement('div');
    wrap.className = 'abar-wrap';
    wrap.innerHTML = `<div>${p}%</div><div class="abar-track"><div class="abar-fill" style="height:${p}%"></div></div><div>${letters[i]}</div>`;
    audienceBars.appendChild(wrap);
  });
});

socket.on('lifeline:expertResult', ({ guessIndex, confident }) => {
  lifeExpert.disabled = true;
  const letters = ['A','B','C','D'];
  const phrase = confident ? 'Я почти уверен, что правильный ответ' : 'Не уверен на сто процентов, но склоняюсь к варианту';
  expertMsg.classList.add('show');
  expertMsg.innerHTML = `🎓 Эксперт: «${phrase} — <b>${letters[guessIndex]}</b>».`;
});

// если пользователь напрямую открыл /game.html без активной игры — room:rejoined/game:question не придёт,
// тогда через 2.5с покажем noGameScreen (см. showFallbackTimer выше)
socket.on('room:rejoined', ({ status }) => {
  if(status !== 'playing'){
    window.location.href = '/lobby.html';
  }
});
</script>
</body>
</html>
